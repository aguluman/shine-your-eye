name: ci

on:
  push:
  pull_request:

jobs:
  core-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The tests run on the JVM and on Node, so a pass covers both targets.
      - name: Core tests
        run: ./gradlew :core:allTests --console=plain

      - name: Core JavaScript library
        run: ./gradlew :core:jsNodeProductionLibraryDistribution --console=plain

      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web type-check and bundle
        working-directory: web
        run: |
          npm ci
          npm run build
